---
layout: default
---
<article class="project">
  <h1>{{ page.title }}</h1>

  {% if page.tags %}
  <p class="project-tags">
    {% for tag in page.tags %}<span class="tag">{{ tag }}</span> {% endfor %}
  </p>
  {% endif %}

  <div class="project-content">
    {{ content }}
  </div>

  <p><a href="/projects.html">&larr; Back to all projects</a></p>
</article>
